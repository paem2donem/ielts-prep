version: '3.8'

services:
  ielts-app:
    build: .
    container_name: forensync-ielts-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8000
    volumes:
      # Veritabanını ve üretilen ses dosyalarını sunucu diskinde kalıcı tutar
      - ./tracker.db:/app/tracker.db
      - ./static/audio:/app/static/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/exam-data/cyber"]
      interval: 30s
      timeout: 10s
      retries: 3
